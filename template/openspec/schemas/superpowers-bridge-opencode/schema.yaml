       - **Pre-flight**：SKILL.md 中负责 pre-flight 的章节（6.2+ 在 `Setup` 前后；
         6.0–6.1 为 `Pre-Flight Plan Review`），含其中的冲突扫描。
       - **逐任务**：SKILL.md 的 The Task Loop（6.0–6.1 为 `The Process` +
         `Handling Implementer Status` + `Handling Reviewer ⚠️ Items`）。
       - **收尾**：SKILL.md 的 Final Review（6.0–6.1 无该章节，收尾按 `The Process` 末段 +
         `../requesting-code-review/code-reviewer.md`）。

       MUST 读完 SKILL.md 指引的每一个文件：
       - 若 SKILL.md 指向 `references/` 下的文件（Superpowers 7.0.1 起为 7 份），逐个读完；
       - 若无 `references/` 目录（6.x），读 SKILL.md 全篇 + 它点名的 prompt 模板文件。
       MUST NOT 因目录不存在而跳过，也 MUST NOT 凭记忆替代实读。

       MUST NOT 用旧的自编排流程替代 SKILL.md。细节一律以 SKILL.md /
       `implementer-prompt.md` / `task-reviewer-prompt.md` / `references/` 为准；
       本阶段只补两处 SKILL.md 没写明的 OmO 落地口径 —— 脚本的 bash 调用形态（见 2.①）
       与 `BASE` 的记录口径（见下）。以下内容不在本节重述：

       - implementer / task reviewer 的 prompt 怎么填（含 TDD 指令怎么进入 prompt ——
         不再手工从 `test-driven-development/SKILL.md` 摘录 RED-GREEN-REFACTOR 前置指令）；
       - fix loop 的轮次上限、BLOCKED / NEEDS_CONTEXT / DONE_WITH_CONCERNS 的处置、
         断点续跑规则。

       派发语法 MUST 按 2.② 的「SDD → OmO 语法映射」改写：`task(category=<按档位表选>, load_skills=[])`，
       不写 `model` 参数，一律异步派发加 `run_in_background=true`，续跑带 `task_id="ses_..."`。

       审查同样交给 SDD：本阶段不另起一套审查流程，审查者按 SKILL.md §3 派发：

       - 单任务审查 → SKILL.md 的 Review the task 环节：用
         `bash "{{SUPERPOWERS_BASE_PATH}}subagent-driven-development/scripts/review-package" <参数按 usage>`
         生成 package，再用 `task-reviewer-prompt.md` 填 prompt、按
         `task(subagent_type="oracle", ...)` 派审查者（`BASE` 是实现者派发前记录的 commit，
         不是 `HEAD~1`）。
       - 修复 → SKILL.md 的 fix loop 环节（7.x 另有 `references/fix-loop.md`，存在则一并读）。
       - 全分支审查 → SKILL.md 的 Final Review（7.x 另有 `references/final-review.md`）。

       除 SDD 流程之外，OSO 只追加三条额外约束（MUST）：

       1. 实现者 report 中 `status = DONE` 的任务，控制方 MUST 在
          `openspec/changes/<name>/tasks.md` 勾选对应 checkbox（见 2.③）；其它状态不勾。
       2. MUST NOT 修改 `openspec/schemas/` 下任何文件与 `openspec/config.yaml`。
          发现确需修改时，STOP 并向 OSO 维护者（oso 仓库 / npm 包作者）报告：
          说明哪个文件、哪一段、为什么模板本身需要改。执行阶段不得改动这些文件。
       3. 审查者报告只采信结构化区块（Spec Compliance / Issues / Assessment 等）；
          正文前的过程叙述一律忽略，不据此下结论。缺必需 section 时才用同一 `task_id`
          要求重发；仅有过程叙述不触发重发。

    4. **Verification**：所有任务完成后，在 worktree 中执行验证：

       执行 `openspec status --change <name> --json`，只看 apply 阶段该交付的部分：
       `tasks` 与 `plan` MUST 为 `done`（也可直接读 `applyRequires` 字段）。

       `verify` 与 `retrospective` 属后续阶段，此时**必然未完成**，`isComplete` 因此必然为
       `false` —— 这是正常的。MUST NOT 因为 `isComplete: false` 就在本阶段补写这两个
       artifact，也不要尝试「补完」。

       此外，控制方 MUST 在 worktree 内**独立执行** plan 中约定的测试命令，记录命令、
       退出码与汇总行中的**测试数量**。数量与 plan 声明不一致时，MUST 先自查原因
       （用例被跳过、plan 计数口径不同等）：能解释则继续并记入 `## Unverified`，
       查不出原因才停下报告。`tests 0` 且退出码 0 属假 RED，MUST 停下。
       实现者报告里的「测试通过」只作线索，不作证据。

       退出码 MUST 以数值写出（如 `exit=0`），MUST NOT 写布尔、MUST NOT 省略：
       - bash / zsh：`cmd; echo "exit=$?"`
       - pwsh / PowerShell：`cmd; echo "exit=$LASTEXITCODE"`
         （`$?` 是布尔值，不是退出码，MUST NOT 当证据用）
       取不到数值退出码 → 该项 MUST 记入 `## Unverified`，MUST NOT 写成通过。

       > 「测试通过即证明在测已有行为」出自 Superpowers `test-driven-development/SKILL.md` §Verify RED - Watch It Fail：
       > `Test passes? You're testing existing behavior. Fix test.` / `Test errors? Fix error, re-run until it fails correctly.`
       > 「`tests 0` 且退出码 0 属假 RED」与「独立复跑、数量核对」为本桥接补充，上游无对应原文。

     5. **Commit**：提交前 MUST 把 `openspec/changes/<name>/tasks.md` 末尾四节补齐
        （`## Decisions` / `## Deferred` / `## Unverified` / `## Verification`），
        一节一条、写明理由；无内容时留 `—`。这些内容随 change 归档，SDD workspace
        删除后仍可追溯。四节分工（MUST，不得混装）：
        - `## Decisions`：`Ruling:`、过程性偏离（结论仍成立）、未勾选的原因；
        - `## Deferred`：不阻塞合并的 Minor，写明 file:line 与未修原因；
        - `## Unverified`：**未真正执行**的验收项；
        - `## Verification`：**执行过的命令与结果** —— 命令原文、汇总行、数值退出码、
          测试数量。证据 MUST NOT 只留在对话里。
        四节只对 apply 阶段新写的 change 生效；历史 change 不追溯、不要求补齐。
       若本次 apply 修改了 `plan.md` 或 `specs/**`：
       - 只允许两类改动：**事实错误**（版本号、命令写法等）与**范围措辞**（验收场景的表述边界）。
         MUST NOT 改验收断言、需求范围或行为约定；确需改这类内容 → STOP 并上报用户。
        - MUST **独立提交**：先提交这些文件，再提交其余（含 tasks.md 的勾选与四节），两笔分开。
       - 该提交的 message MUST 写明：改了哪个 artifact、旧值 → 新值、为什么。
       - 默认不需要复审。若改动触及验收断言或需求范围（正常情况下应已被上一条拦下），
         MUST 先做一次 scoped re-review：`review-package` → `task-reviewer-prompt.md` →
         `task(subagent_type="oracle", ...)`，结论记入 `## Decisions` 后再提交。

       **改了 `plan.md` 就必须让 brief 失效（MUST）**

       brief 是一次性抽取的产物，实现者只读 brief、不读 plan。因此只要 `plan.md` 在
       任何一步被修改（含 Step 8 的事实错误修正），MUST 重新生成受影响 task 的 brief，
       否则实现者会按已废弃的指令继续做：

       - 重跑 `task-brief <PLAN_FILE> <N>`（路径与参数以脚本打印的 usage 为准，
         各版本目录不同，MUST NOT 写死路径）；
       - 在 SDD ledger 记一行：`brief regenerated for task N (reason: plan 事实修正)`。

       按该 task 的派发状态处置（MUST）：

       - 尚未派发 → 正常派发，使用新 brief；
       - 已返回 → 下一次续跑 / fix loop 派发 MUST 使用新 brief；
       - 仍在运行 → MUST 等它返回（MUST NOT 并行派发实现者），返回后按新 brief 复核一次，
         差异按 fix loop 处理。MUST NOT 假设可以向**运行中的**子 Agent 注入消息
         —— `task(task_id=...)` 只能续跑已结束的会话。

       然后在 worktree 中提交其余变更：

       ```bash
       git add -A && git commit -m "<name>: <描述>"
       ```

    6. **完成**：

       apply 阶段结束。通知用户：

       ```
       ✓ 变更 <name> 已实现并提交。
         Worktree 路径: .worktrees/<name>/
         分支: feature/<name>

       下一步: 运行 /opsx-finish 进行合并、清理和归档。
       ```
