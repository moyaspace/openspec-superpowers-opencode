       以及「请升级 Superpowers 或改用 v5 分支」；不要静默降级。

       同时确认项目所需的 CLI 工具可用。读取 plan.md 找出所有提到的工具
       （如 `mvn`/`mvnw`、`docker`、`python3`、`node`/`npm` 等）。
       若缺少工具，报告 WARNING（不停止）——用户可能有替代方案。

       确认 .gitignore 已就绪：若 plan.md 包含 `npm install` / `cargo build` / `pip install`
       等会产生构建产物的命令，执行前先确认对应子目录已有 .gitignore 排除产物
       （Node/TS：`node_modules/`、`dist/`、`*.tsbuildinfo`；Rust：`target/`；
       Python：`__pycache__/`、`*.pyc`、`.venv/`、`dist/`；Go：二进制产物）。
