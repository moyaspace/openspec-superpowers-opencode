    1. **Workspace — 检测并进入已有 worktree**：

       检查 `.worktrees/<name>/` 目录是否存在：

       - 存在 → `cd .worktrees/<name>`
       - 不存在 → STOP，提示用户先运行 `/opsx-ff <name>` 或 `/opsx-new <name>` 创建 worktree

    2. **v6+ 委托契约（四节，MUST / MUST NOT）**：

      下面四节只对 **v6+ 分支**生效，是硬约束，不是参考资料。SKILL.md 里的命令与派发语法
      都按 **Claude Code（下称 CC）** 侧写，落到 **oh-my-openagent（下称 OmO）** 必须按本节改写；v5 分支不受本节影响。
      本节必须在 Executor 之前读完，否则会先照抄 **CC** 语法。

       **① bash 调用写法（MUST）**

       SDD 的 `scripts/` 下三个脚本虽然有 `#!/usr/bin/env bash`，但安装到本机后不保证有
       可执行位（Windows 侧尤其没有），且 Windows 上直接执行脚本会失败（会话 shell 未必
       是 bash）；加上占位符替换后的绝对路径可能含空格，因此：

       - MUST 一律写成 `bash <脚本路径> [参数...]`，不得直接执行脚本路径。
       - 脚本路径 MUST 用双引号包裹。
       - Windows（Git Bash / MSYS）同样 MUST 带 `bash ` 前缀；MUST NOT 省略前缀，
         MUST NOT 用 `sh` 或 `./` 替代。
       - `scripts/...` 是相对 SDD 技能目录的路径，MUST NOT 当作仓库相对路径。

       参数个数与顺序 MUST 以脚本自身的 usage 为准，不由本阶段规定——不同 Superpowers 版本不同
       （6.1.x 的 `sdd-workspace` 无参数，6.2.0 起必须 1 个 `PLAN_FILE`）。
       不确定时先执行 `bash "<脚本绝对路径>"`（不传参数），脚本会印出 usage 并以非零码退出，
       按提示补齐后重试。MUST NOT 凭记忆猜测参数。

       | 脚本 | apply 阶段 MUST 使用的写法 |
       |---|---|
       | `sdd-workspace` | `bash "{{SUPERPOWERS_BASE_PATH}}subagent-driven-development/scripts/sdd-workspace" <参数按 usage>` |
       | `task-brief` | `bash "{{SUPERPOWERS_BASE_PATH}}subagent-driven-development/scripts/task-brief" <参数按 usage>` |
       | `review-package` | `bash "{{SUPERPOWERS_BASE_PATH}}subagent-driven-development/scripts/review-package" <参数按 usage>` |

       `bash --version` 失败 → STOP 并告知用户安装 Git for Windows（或等价 bash）后重试；
       MUST NOT 静默降级成手工拼 prompt。

       **② SDD → OmO 语法映射（MUST）**

      SKILL.md 用 **Claude Code（CC）** 的 Subagent 语义描述派发。在 **oh-my-openagent（OmO）** 中 MUST 按下表改写，
      MUST NOT 照抄 `Subagent (general-purpose)` 一类语法：

       | SDD 写法 | OmO MUST 写法 | 说明 |
       |---|---|---|
       | `Subagent (general-purpose)` | 实现者：`task(category=<按下表选>, load_skills=[], description="<任务名>", prompt="<prompt>")` | `description` 必填；`category` MUST 显式指定，不得省略（省略会继承会话默认模型）；只用于**实现者** |
       | Subagent 承担审查角色（task reviewer） | 审查者：`task(subagent_type="oracle", description="<审查名>", prompt="<prompt>")` | 与本仓库既有约定一致（v5 分支同样用 `oracle`）；MUST NOT 用 `category` 派审查者 |
       | 按任务复杂度选 `model`（SKILL.md 的 Model Selection） | **不写** `model` 参数 | 档位由下方「实现者档位」表决定；MUST NOT 写 `model` 参数 |
       | 异步派发（一律） | `run_in_background=true` | 结果用 `background_output(task_id="bg_...")` 收取，不要短超时轮询。不要为了少一步往返改成同步：同步会阻塞主会话，用户在等待期间无法插话 |
       | 续跑同一个子 Agent（fix loop 前 3 轮、补充上下文） | `task(..., task_id="ses_...")` | 首次派发返回的 `ses_...` 会话 ID 要记下；续跑 MUST 带上它，不得另起新 Agent 重来 |
       | `load_skills=["test-driven-development"]` 之类 | **MUST NOT 依赖**，一律 `load_skills=[]` | `load_skills` 只接受已注册的 skill ID；Superpowers 的 skill 是文件系统上的 `.md`，不是注册技能，传进去会被**静默忽略**（不报错、不生效） |

       **实现者档位（MUST，只按 plan 里读得到的客观信号，不估计时长）**

       | plan 的形态 | category |
       |---|---|
       | 计划里已含完整代码，实现等于照抄 + 跑测试；或只碰 1–2 个文件且规格完整 | `quick` |
       | 要改多个文件，且它们彼此牵连（改签名、加字段、接新模组），但做法计划里已写明 | `deep` |
       | 计划没定方案，实现者必须自行决定方案、模组边界或资料结构；或实现者必须先理解大片代码库才能动手 | `ultrabrain` |

       > 判据出自 Superpowers `subagent-driven-development/SKILL.md` 的 Model Selection：
       > `Touches 1-2 files with a complete spec` / `Touches multiple files with integration concerns` /
       > `Requires design judgment or broad codebase understanding`。
       > 上游按模型能力分三档，本桥接按 OmO 的 category 映射，语义一一对应。

       **派发后取结果（MUST）**：派发时 MUST 记下 `task()` 返回的 `bg_...` 任务 ID 与
       `ses_...` 会话 ID。完成后 MUST 主动调用 `background_output(task_id="bg_...")` 取结果。

       本桥接已知问题：子任务完成时虽会唤醒控制方回合，但**唤醒信号不含任务 ID 与结果正文**
       （只剩一行内部标记）。因此 MUST NOT 假设结果会自动送达，也 MUST NOT 依赖唤醒信号判断
       哪个任务完成——用自己记下的 `bg_...` 去取。

       这条与插件版本无关：即使某些版本的唤醒信号带正文、或只在全部任务完成时汇总通知，
       按「自己记 ID、主动取」执行都能成立，因此 MUST NOT 因通知变好而改回被动等待。

       等待期间若有本地工作（更新 ledger、打包下一个审查）就继续做，然后回来取结果；
       不要用短超时反复轮询，也不要无声地无限等。MUST NOT 并行派发多个实现者（会冲突）。

       若有多个已派发且尚未取结果的任务，MUST 逐个取完，不能只取一个就继续。

       > 「不要短超时轮询、不要无声无限等、不得并行派发多个实现者」出自 Superpowers
       > `subagent-driven-development/SKILL.md` §Waiting on dispatched subagents：
       > `never poll a wait interface with short timeouts, and never sit in one silent, open-ended wait either`
       > `Never dispatch multiple implementation subagents in parallel (conflicts).`
       > 该节另有「child results arrive on their own」一句，在 OmO 当前环境**不成立**
       > （唤醒信号无正文），故不采纳。

       Superpowers skill 的唯一正确传递方式：`Read` 该 `.md` 文件，把内容（或其要求）
       直接嵌进 `prompt`，或让子 Agent 自己去 `Read` 指定路径。

       **③ tasks.md 勾选契约（MUST）**

       **勾选依据是实际执行证据，不是 plan 的声明。**

       - 实现者 report 中 `status = DONE` 的任务，控制方 MUST 在
         `openspec/changes/<name>/tasks.md` 勾选对应 checkbox（`- [ ]` → `- [x]`）。
         SDD 只维护自己的 ledger 与 todo，不会写 OpenSpec 的 tasks.md，这一条只能由
         apply 阶段补上。
       - plan task 与 checkbox **不是 1:1**：task 是派发与审查单位，checkbox 是验收点，
         数量与顺序都不保证对应。用 task 的 `**Covers:**` 声明快速定位；声明与实际不符时
         MUST 以实际执行证据为准，并如实记录偏离，不得因声明对不上而中断流程。
       - **纯验证项**（`openspec validate`、工作区干净、全量测试）不由任何 plan task 代勾；
         由本命令在实际执行到该验证时勾选（如 Step 7 / Step 8）。未执行不得勾选。
       - 无法确定某 checkbox 是否已完成时 MUST NOT 勾选，并在本文件末尾写明原因 ——
         宁可少勾（可见），不可错勾（不可见）；MUST NOT 留无声的空框（归档后无人能分辨
         那是「没做」还是「做了但按规则不勾」）。
       - 非 `DONE` 状态的处置 MUST 与上游 `Handling Implementer Status` 对齐，MUST NOT 一刀切：
         - `DONE_WITH_CONCERNS`：顾虑属**正确性 / 范围** → 先处理（fix loop），MUST NOT 勾；
           顾虑属**观察性**（如「这个文件在变大」）→ 先记入 `## Decisions`，再按该 task 的
           审查是否 clean 决定：clean 则**可勾**（上游的完成判据是「review clean → ledger 记
           complete」，状态字面不是判据），不 clean 则走 fix loop、不勾。
         - `NEEDS_CONTEXT` / `BLOCKED`：补齐上下文或降级拆分后重新派发，MUST NOT 勾。
       - MUST 逐条勾选，不得批量把所有 checkbox 一次勾完；审查回退的任务 MUST 改回未勾选。
       - 未真正执行的验收项（测试、构建、手工验证）MUST 记为「未验」，MUST NOT 写成通过。
       - 只有当**凭现有信息无法判断**某个 checkbox 的完成状态时才询问用户；
         有事实依据的分歧 MUST 自行按证据处理，不把判断推回给用户。

       **④ 冲突与缺口的裁决（MUST）**

       pre-flight 扫描发现的冲突或缺口，若某条 MUST 可测、且补测试的成本低
       （不新增依赖、改动不超一个测试文件），MUST 本轮当场补掉，不得以
       「交给后续审查」结案。只有成本高或无法自动验证时，才留给最终审查分诊。

       约束含「第一个 / 优先级 / 顺序」这类语义时，MUST 补一个能让优先级真正起作用的用例：
       让多个候选同时满足触发条件，验证选中的是被声明为优先的那个。候选数量由签名决定，不写死。

       每条裁决 MUST 写明：决定、理由、判断错误时的代价。

       > 裁决机制见本阶段开头的「不阻断原则」。格式 `Ruling: <what you decided> — <why> —
       > <what it costs if wrong>` 出自 Superpowers **7.x** 的 `subagent-driven-development/SKILL.md`
       > §`Rulings, not stalls`；6.0–6.1 **无此节**（其 SKILL.md 顶部只有 `Continuous execution`：
       > 不打断 + 3 条停止条件），因此裁决与记录义务由本阶段提供，MUST NOT 依赖该章节名存在。
       > 「可测 MUST 当场补」与「优先级语义补多候选用例」两条为本桥接补充，上游无对应原文。

    3. **Executor — 实现与审查**：

       **派发前分诊（MUST）**：逐个检查 plan task 的 `**Covers:**`。

       - **全部命中纯验证项** → **不派发**。该 task 的验收项由本命令在 Verification /
         Commit 阶段亲自执行并勾选；plan 里不该存在这种 task，若遇到说明 plan 生成有缺陷，
         照此处理并在 `## Decisions` 记录。
       - **部分命中** → 代码部分派发，验证部分留给 Verification 阶段。
       - **不含纯验证项** → 正常派发。

       判断错误时不要绕过：`review-package` 报 `empty commit range` 这类「范围为空」的错误，
       说明派出去的对象没有产生任何变更。MUST 回头核对这条 task 的 `**Covers:**` 是否全部属于
       纯验证项，重新判断该不该派发；MUST NOT 自行编造审查内容把审查走完。

       **Superpowers v5：**

       对 plan.md 中的每个 **task** 执行（task 是派发与审查的单位；step 是实现者内部的执行方法，不单独派发）：

       > 若 plan 中存在「同类小改动重复多次」的任务（同一行修复、常量变更、字段新增等），MUST NOT 逐个派发：
       > 合并为一次派发、一次 diff 评审（Superpowers 7.0.1 起 `subagent-driven-development/references/batching.md`
       > 有此规定；更早版本按同一原则处理）。只有需要独立判断、独立测试或独立评审面的工作，才单独派发。

      a) 读取 implementer-prompt.md 模板，按模板构造 prompt：
         模板路径：
           {{SUPERPOWERS_BASE_PATH}}subagent-driven-development/implementer-prompt.md

      b) 构建实现 prompt 之前，先载入 TDD skill：

         Read 以下文件：
           {{SUPERPOWERS_BASE_PATH}}test-driven-development/SKILL.md

         提取 RED-GREEN-REFACTOR 流程、铁律（No production code without a failing test first）、
         验证检查清单，作为实现 prompt 的前置指令。

         然后使用 task() 调用子 Agent 执行任务（load_skills=[]，纯 prompt 驱动）：
            task(
              category="<按 2.② 的档位表选>",
              load_skills=[],
              description="实现 <任务名>",
              prompt="<TDD 前置指令 + 模板填充的内容>",
              run_in_background=true
            )

       c) 任务完成后，依序执行两步审查：

       **Superpowers v5（两步审查）：**
         c1) 读取 spec-reviewer-prompt.md → oracle 做 spec 审查
         c2) 审查通过后，读取 code-quality-reviewer-prompt.md → oracle 做代码质量审查
         c3) 全部通过后，标记 tasks.md checkbox 为完成

       重要 — TDD 方法论通过 Read + prompt 嵌入传递给子 Agent，
       而非透过 load_skills（Superpowers skills 为文件系统路径，
       不支持 load_skills 机制）。

      本 schema 不支持 `executing-plans` 作为降级方案。

       **Superpowers v6+ — 委托给 SDD，不再自编排：**

       严格按 `{{SUPERPOWERS_BASE_PATH}}subagent-driven-development/SKILL.md` 执行。
       实现与审查是 SDD 同一个循环的两半，一起交给它，不得拆成两套自作流程：

       下列章节名自 Superpowers 6.2.0 起存在；6.0–6.1 无同名章节，按你实际读到的 SKILL.md 中
       对应职责的章节执行。

       - **Setup**：SKILL.md 的 Setup 段（workspace 用
