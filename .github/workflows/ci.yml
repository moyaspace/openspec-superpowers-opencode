name: PR Check

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

jobs:
  check:
    strategy:
      # 三个平台都跑完再汇总，避免一个失败就取消其余平台
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # package.json engines 要求 >=22.9.0
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # elevated 套件在非 Windows 平台直接运行（不经 gsudo），其中 lifecycle-e2e 会跑
      # `oso init`，需要真实 openspec CLI 才能走完 8/8。
      - name: Install openspec CLI (for elevated lifecycle test)
        # Pinned: the CLI's human-readable output changes between minor versions
        # (1.4.0 replaced "(schema: X)" with a "Schema: X" line) and this repo
        # asserts on that output. Bump deliberately, together with the tests.
        run: npm i -g @fission-ai/openspec@1.16.0

      # npm test = typecheck + build + 主套件 + elevated
      # （Windows 无 gsudo 时 elevated 自动 SKIP，由 test/elevated/run.mjs 处理）
      - name: Run tests
        run: npm test

      # ── CLI 可用性（必须放在 npm test 之后：dist/ 由 test 里的 build 步骤生成）──
      - name: CLI --version
        run: node dist/cli/index.js --version

      - name: CLI -v
        run: node dist/cli/index.js -v

      - name: CLI --help
        run: node dist/cli/index.js --help

      - name: CLI --help (zh-CN)
        run: node dist/cli/index.js --lang zh-CN --help

      - name: CLI create-project alias --help
        run: node dist/cli/create-project.js --help

      # ── oso 别名验证 ──
      - name: Verify oso alias in package.json
        run: node -e "const p=require('./package.json'); console.log('✅ oso alias:', p.bin.oso)"

      # ── 守卫：构建产物不得回潮进 git，构建不得写脏工作区 ──
      - name: Guard tracked build artifacts
        shell: bash
        run: |
          tracked=$(git ls-files dist | wc -l)
          [ "$tracked" -eq 0 ] || { echo "FAIL: dist/ is tracked by git ($tracked files)"; exit 1; }

          dirty=$(git status --porcelain)
          [ -z "$dirty" ] || { echo "FAIL: working tree dirty after build:"; echo "$dirty"; exit 1; }

      # ── Tarball 构建 ──
      - name: npm pack
        run: npm pack

      # ── Tarball 内容完整性 ──
      - name: Verify tarball contents
        shell: bash
        run: |
          PACKAGE=$(ls *.tgz)
          echo "Tarball: $PACKAGE"
          errors=0

          # 将 tar 列表写入临时文件，避免 pipe+grep 的兼容性问题
          tar -tzf "$PACKAGE" > /tmp/tarlist.txt

          # 迁移自 test/imp16-tarball-equivalence.test.js 的独有断言
          tar -xzf "$PACKAGE" -O package/assets/shims/openspec.ps1 | grep -q 'Join-Path \$TOOL_DIR "lib"' \
            && { echo "FAIL: ps1 shim still references lib"; exit 1; }

          grep -qxF "package/tsconfig.json" /tmp/tarlist.txt \
            && { echo "FAIL: tarball contains tsconfig"; exit 1; }
          grep -q "^package/src/" /tmp/tarlist.txt \
            && { echo "FAIL: tarball contains src"; exit 1; }

          # 精确整行匹配（-qxF），避免 *.js 误匹配 *.js.map
          for file in \
            "package/dist/cli/index.js" \
            "package/dist/cli/create-project.js" \
            "package/dist/registry.js" \
            "package/dist/registry-utils.js" \
            "package/dist/setup/index.js" \
            "package/dist/setup/planner.js" \
            "package/dist/setup/merge.js" \
            "package/dist/setup/shim-check.js" \
            "package/assets/shims/openspec" \
            "package/assets/shims/openspec.cmd" \
            "package/assets/shims/openspec.ps1" \
            "package/.gitattributes" \
            "package/package.json" \
            "package/template/_AGENTS.md" \
            "package/template/openspec/schemas/superpowers-bridge-opencode/schema.yaml" \
            "package/template/skills.lock.v5.json" \
            "package/template/skills.lock.v6.json" \
            "package/template/skills.lock.v7.json" \
            "package/template/_gitignore" \
            "package/template/_editorconfig" \
            "package/template/_gitattributes" \
            "package/docs/QUICKSTART.md" \
            "package/LICENSE"; do
            if grep -qxF "$file" /tmp/tarlist.txt; then
              echo "  ✅ $file"
            else
              echo "  ❌ $file"
              errors=$((errors + 1))
            fi
          done

          for removed in \
            "package/scripts/setup.sh" \
            "package/scripts/setup.ps1"; do
            if grep -qxF "$removed" /tmp/tarlist.txt; then
              echo "  ❌ removed file is still packaged: $removed"
              errors=$((errors + 1))
            fi
          done

          # 验证 template/.opencode/ 结构
          echo ""
          echo "--- template/.opencode/ structure ---"
          grep "package/template/\.opencode/" /tmp/tarlist.txt | head -5

          if [ $errors -gt 0 ]; then
            echo ""
            echo "❌ $errors critical file(s) missing from tarball"
            exit 1
          fi
          echo ""
          echo "✅ All critical files present"