name: PR Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      # ── CLI 可用性 ──
      - name: CLI --version
        run: node bin/cli.js --version

      - name: CLI -v
        run: node bin/cli.js -v

      - name: CLI --help
        run: node bin/cli.js --help

      - name: CLI --help (zh-CN)
        run: node bin/cli.js --lang zh-CN --help

      - name: CLI create-project alias --help
        run: node bin/create-project.js --help

      # ── oso 别名验证 ──
      - name: Verify oso alias in package.json
        run: node -e "const p=require('./package.json'); console.log('✅ oso alias:', p.bin.oso)"

      - name: Run tests
        run: npm test

      # ── Tarball 构建 ──
      - name: npm pack
        run: npm pack

      # ── Tarball 内容完整性 ──
      - name: Verify tarball contents
        shell: bash
        run: |
          PACKAGE=$(ls *.tgz)
          echo "Tarball: $PACKAGE"
          errors=0

          # 将 tar 列表写入临时文件，避免 pipe+grep 的兼容性问题
          tar -tzf "$PACKAGE" > /tmp/tarlist.txt

          for file in \
            "package/bin/cli.js" \
            "package/bin/create-project.js" \
            "package/.gitattributes" \
            "package/package.json" \
            "package/template/_AGENTS.md" \
            "package/template/openspec/schemas/superpowers-bridge-opencode/schema.yaml" \
            "package/template/skills.lock.v5.json" \
            "package/template/skills.lock.v6.json" \
            "package/template/_gitignore" \
            "package/template/_editorconfig" \
            "package/template/_gitattributes" \
            "package/lib/setup/index.js" \
            "package/lib/setup/planner.js" \
            "package/lib/setup/deploy.js" \
            "package/lib/setup/reset.js" \
            "package/lib/setup/verify.js" \
            "package/docs/QUICKSTART.md" \
            "package/LICENSE"; do
            if grep -q "$file" /tmp/tarlist.txt; then
              echo "  ✅ $file"
            else
              echo "  ❌ $file"
              errors=$((errors + 1))
            fi
          done

          for removed in \
            "package/scripts/setup.sh" \
            "package/scripts/setup.ps1"; do
            if grep -q "$removed" /tmp/tarlist.txt; then
              echo "  ❌ removed file is still packaged: $removed"
              errors=$((errors + 1))
            fi
          done

          # 验证 template/.opencode/ 结构
          echo ""
          echo "--- template/.opencode/ structure ---"
          grep "package/template/\.opencode/" /tmp/tarlist.txt | head -5

          if [ $errors -gt 0 ]; then
            echo ""
            echo "❌ $errors critical file(s) missing from tarball"
            exit 1
          fi
          echo ""
          echo "✅ All critical files present"
